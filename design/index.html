<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Word</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --muted:#6b6b6b;
    --line:#e5e5e5;
    --focus:#111111;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main{
    text-align:center;
    padding:2rem;
    width:100%;
    max-width:40rem;
  }
  h1{
    font-size:clamp(2.5rem,8vw,5rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 1.5rem;
    line-height:1.05;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.875rem;
    color:var(--muted);
    margin-bottom:2rem;
  }
  .dot{
    width:0.5rem;height:0.5rem;border-radius:50%;
    background:var(--muted);
  }
  .demo{
    display:flex;
    flex-wrap:wrap;
    gap:0.75rem;
    justify-content:center;
  }
  button{
    font:inherit;
    font-size:0.875rem;
    padding:0.5rem 1rem;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    border-radius:0.5rem;
    cursor:pointer;
    transition:border-color 120ms ease, background 120ms ease;
  }
  button:hover{border-color:var(--ink)}
  button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }
  button[aria-pressed="true"]{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .hint{
    margin-top:1.5rem;
    font-size:0.75rem;
    color:var(--muted);
  }
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
</style>
</head>
<body>
<main>
  <h1 id="text" aria-live="polite">Hello Word</h1>
  <p class="status" id="status" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span id="status-label">Loaded from database</span>
  </p>
  <p class="demo" aria-label="State preview">
    <button type="button" data-state="loading">Loading</button>
    <button type="button" data-state="loaded" aria-pressed="true">Loaded</button>
    <button type="button" data-state="empty">Empty</button>
    <button type="button" data-state="error">Error</button>
  </p>
  <p class="hint">Demo controls preview the loading, loaded, empty and error states.</p>
</main>
<script>
  const states = {
    loading: { text: "\u2026", label: "Loading from database" },
    loaded:  { text: "Hello Word", label: "Loaded from database" },
    empty:   { text: "\u2014", label: "No text found in database" },
    error:   { text: "Error", label: "Could not reach the database" }
  };
  const heading = document.getElementById("text");
  const label = document.getElementById("status-label");
  const buttons = document.querySelectorAll("button[data-state]");

  buttons.forEach(function(btn){
    btn.addEventListener("click", function(){
      const s = states[btn.dataset.state];
      heading.textContent = s.text;
      label.textContent = s.label;
      buttons.forEach(function(b){
        b.setAttribute("aria-pressed", String(b === btn));
      });
    });
  });
</script>
</body>
</html>
